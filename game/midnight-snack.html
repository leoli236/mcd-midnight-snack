<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深夜进食 · Midnight Snack</title>
<style>
:root{
  --bg:#16142a; --panel:#221f3d; --panel2:#2b2750; --line:#443d70;
  --ink:#ece9f8; --dim:#9a94c4; --warm:#ffcc4d; --red:#ff6b5b;
  --green:#7bd88f; --blue:#7aa7ff; --pink:#ff9fb2;
  --font: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font);
  /* 注意：这里不能用 align-items:center —— 菜单有 20 张卡片时内容高于视口，
     flex 居中会把顶部裁到视口外且无法滚动。改用 #app{margin:auto}：
     内容短时居中，内容高时正常滚动、不裁切。 */
  display:flex; overflow-y:auto;
  padding:16px; line-height:1.75; -webkit-font-smoothing:none;
  background-image:radial-gradient(circle at 50% 0%, #2a2450 0%, #16142a 60%);
  background-attachment:fixed;
}
#app{width:100%; max-width:760px; margin:auto;}

/* ---------- pixel art ---------- */
.art{display:grid; grid-template-columns:repeat(12, var(--px,7px)); width:max-content; margin:0 auto;}
.art i{width:var(--px,7px); height:var(--px,7px);}
.art.big i{transition:transform .16s ease, opacity .16s ease;}
.art.big i.gone{transform:scale(.12) rotate(28deg); opacity:0;}
.art.big i.hit{cursor:pointer;}
.art.big i.dead{cursor:default;}

/* ---------- panels ---------- */
.panel{
  background:var(--panel); border:3px solid var(--line);
  box-shadow:6px 6px 0 rgba(0,0,0,.45); padding:22px;
}
h1{font-size:22px; letter-spacing:2px; color:var(--warm);}
.sub{color:var(--dim); font-size:13px; margin-top:6px;}
.scene-text{font-size:14.5px; min-height:6.5em; white-space:pre-wrap; margin:14px 0 4px;}
.cursor{color:var(--warm); animation:blink .7s steps(1) infinite;}
@keyframes blink{50%{opacity:0}}

/* ---------- HUD ---------- */
#hud{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
.stat{
  flex:1 1 130px; background:var(--panel); border:2px solid var(--line);
  padding:7px 9px; position:relative; overflow:hidden;
}
.stat .k{font-size:10.5px; color:var(--dim); letter-spacing:1px;}
.stat .v{font-size:15px; font-weight:bold;}
.bar{height:6px; background:#15132b; margin-top:5px; border:1px solid #0f0d20;}
.bar span{display:block; height:100%; transition:width .45s ease;}
.pop{
  position:absolute; right:8px; top:4px; font-size:12px; font-weight:bold;
  animation:pop 1.1s ease forwards; pointer-events:none;
}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}

/* ---------- choices ---------- */
.choices{display:flex; flex-direction:column; gap:10px; margin-top:16px;}
button{
  font-family:var(--font); font-size:13.5px; color:var(--ink);
  background:var(--panel2); border:3px solid var(--line);
  padding:11px 14px; text-align:left; cursor:pointer;
  box-shadow:4px 4px 0 rgba(0,0,0,.4); transition:transform .06s, background .12s;
  width:100%; line-height:1.5;
}
button:hover{background:#37325f; border-color:var(--warm);}
button:active{transform:translate(3px,3px); box-shadow:1px 1px 0 rgba(0,0,0,.4);}
button .tag{color:var(--dim); font-size:11px; display:block; margin-top:3px;}
button.primary{background:var(--warm); color:#1b1833; font-weight:bold; border-color:#c99a2e; text-align:center;}
button.primary:hover{background:#ffd970;}
button.ghost{background:transparent; border-color:#3a3560; color:var(--dim); text-align:center; font-size:12px;}
button:disabled{opacity:.45; cursor:not-allowed;}

/* ---------- 分类 tabs ---------- */
.tabs{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:12px 0 2px;}
.tab{
  width:auto; padding:5px 11px; font-size:12px; box-shadow:2px 2px 0 rgba(0,0,0,.35);
  background:#1c1936; border:2px solid var(--line); color:var(--dim);
}
.tab.on{border-color:var(--warm); color:var(--warm); background:#2b2750;}

/* ---------- 心情 chips ---------- */
.section-t{font-size:11px; color:var(--dim); letter-spacing:2px; margin:14px 0 6px; text-align:center;}
.moods{display:flex; flex-wrap:wrap; gap:7px; justify-content:center;}
.chip{
  font-family:var(--font); font-size:12px; background:#1c1936; border:2px solid var(--line);
  color:var(--dim); padding:6px 11px; cursor:pointer; box-shadow:2px 2px 0 rgba(0,0,0,.35);
}
.chip:hover{border-color:var(--warm); color:var(--ink);}
.chip.on{border-color:var(--pink); color:var(--pink); background:#2b2038;}
.chip.no{opacity:.35; cursor:not-allowed; text-decoration:line-through;}
.mood-desc{font-size:12px; color:var(--pink); text-align:center; min-height:2.8em; margin:8px 0 2px; white-space:pre-wrap;}
.mood-desc b{color:var(--warm);}

/* ---------- menu cards ---------- */
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:10px; margin-top:10px;}
.card{
  background:var(--panel2); border:3px solid var(--line); padding:8px;
  cursor:pointer; position:relative; transition:border-color .12s;
  user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
}
.card:hover{border-color:var(--warm);}
.card.on{border-color:var(--green); background:#2c3d35;}
.card.bump{animation:bump .2s ease;}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
.card .thumb{
  width:100%; height:74px; display:flex; align-items:center; justify-content:center;
  background:#15132b; overflow:hidden; margin-bottom:6px;
}
.card .thumb img{width:100%; height:100%; object-fit:contain;}
.card .qty{
  position:absolute; left:-3px; top:-3px; background:var(--warm); color:#1b1833;
  font-weight:bold; font-size:12px; padding:0 6px; border:2px solid #1b1833; display:none;
}
.card.on .qty{display:block;}
.card .minus{
  position:absolute; right:-3px; top:-3px; width:22px; height:22px; line-height:16px;
  background:var(--panel); border:2px solid var(--line); color:var(--dim);
  font-weight:bold; text-align:center; display:none; cursor:pointer; font-size:14px;
}
.card.on .minus{display:block;}
.card .minus:hover{border-color:var(--red); color:var(--red);}
.card .nm{font-size:13px; font-weight:bold; line-height:1.35;}
.card .cat{font-size:10px; color:var(--blue); margin-top:2px;}
.card .mt{font-size:11px; color:var(--dim); margin-top:2px; display:block; min-height:2.4em;}
.card .kc{color:var(--warm); font-size:11px;}
.card .ings{font-size:10px; color:var(--dim); margin-top:3px; line-height:1.5;}
.card .ings b{color:var(--green); font-weight:normal;}

/* ---------- 购物车条 ---------- */
.cart{
  margin-top:12px; padding:10px 12px; border:2px dashed var(--line);
  background:#1c1936; font-size:12px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center;
}
.cart b{color:var(--warm); font-size:13px;}
.cart .it{color:var(--dim); flex:1 1 100%; font-size:12px;}
.cart .it em{color:var(--green); font-style:normal;}
.flash{color:var(--pink); animation:blink .5s steps(1) 3;}

/* ---------- 后厨 / 出餐 ---------- */
.kitchen{margin-top:10px;}
.krow{
  display:flex; align-items:center; gap:10px; padding:8px 10px; margin-bottom:6px;
  border:2px solid var(--line); background:#1c1936; font-size:12.5px;
}
.krow.ok{border-color:var(--green);}
.krow.bad{border-color:var(--red);}
.krow.warn{border-color:var(--warm);}
.krow .kn{flex:1;}
.krow .ks{font-size:12px; color:var(--dim);}
.krow.ok .ks{color:var(--green);}
.krow.bad .ks{color:var(--red);}
.krow.warn .ks{color:var(--warm);}
.kbar{height:8px; background:#15132b; border:2px solid var(--line); margin:10px 0 4px;}
.kbar span{display:block; height:100%; background:var(--warm); transition:width .3s ease;}
.tray{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:12px 0;}
.tray .ti{text-align:center; font-size:11px; color:var(--dim);}
.tray .ti .nm{color:var(--ink); font-weight:bold; font-size:12px;}

/* ---------- 进食 ---------- */
.eat-head{font-size:12.5px; color:var(--dim); text-align:center;}
.eat-head b{color:var(--ink);}
.artwrap{position:relative; display:flex; justify-content:center; margin:10px 0 4px; min-height:170px; align-items:center;}
.eat-tip{text-align:center; font-size:13.5px; margin:6px 0 8px; min-height:3.2em; white-space:pre-wrap;}
.eat-tip b{color:var(--warm);}
.eat-tip .cmb{color:var(--pink); font-weight:bold;}
.eat-tip .ing{color:var(--green); font-size:12px;}
.eat-bar{height:9px; background:#15132b; border:2px solid var(--line);}
.eat-bar span{display:block; height:100%; background:var(--green); transition:width .3s ease;}
.bite-pop{
  position:absolute; font-size:12px; font-weight:bold; color:var(--warm);
  pointer-events:none; animation:pop 1s ease forwards; text-shadow:1px 1px 0 #000;
}
.crumb{
  position:absolute; width:5px; height:5px; pointer-events:none;
  animation:crumb .6s ease-out forwards;
}
@keyframes crumb{
  0%{opacity:1; transform:translate(0,0) scale(1);}
  100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.3);}
}
.chomp{animation:chomp .13s ease;}
@keyframes chomp{0%{transform:translate(0,0)}40%{transform:translate(-2px,3px) scale(1.02)}100%{transform:translate(0,0)}}

/* ---------- 搭配命名 ---------- */
.combo-card{
  margin-top:12px; padding:12px; border-left:4px solid var(--pink);
  background:#1c1936; font-size:13px;
}
.combo-card .cn{color:var(--warm); font-weight:bold; font-size:14px;}
.combo-card .cd{color:var(--dim); font-size:12px; margin-top:4px;}

/* ---------- ending ---------- */
.badge{font-size:11px; color:var(--warm); letter-spacing:3px;}
.end-title{font-size:20px; margin:6px 0 12px; color:var(--warm);}
.end-body{font-size:14px; white-space:pre-wrap;}
.delta{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:7px; margin:16px 0;}
.delta div{background:#1c1936; border:2px solid var(--line); padding:6px 8px; font-size:12px;}
.delta b{display:block; font-size:14px;}
.note{
  margin-top:14px; padding:12px; border-left:4px solid var(--warm);
  background:#1c1936; font-size:13px; color:var(--pink);
}
.warn{margin-top:12px; font-size:11.5px; color:var(--dim); text-align:center;}
.center{text-align:center;}
.row{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
.row button{flex:1 1 140px;}
.row button.ghost{flex:0 1 auto; padding:11px 14px;}
.hidden{display:none !important;}

/* ---------- topbar / 音频控制 ---------- */
#topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:11px; color:var(--dim); gap:8px; flex-wrap:wrap;}
#audiobar{display:flex; align-items:center; gap:8px;}
#mute{cursor:pointer; border:2px solid var(--line); background:transparent; padding:3px 8px; width:auto; box-shadow:none; font-size:11px; color:var(--dim);}
#mute:hover{background:var(--panel2); border-color:var(--warm);}
#vol{
  -webkit-appearance:none; appearance:none; width:78px; height:6px; background:#15132b;
  border:1px solid var(--line); outline:none; cursor:pointer;
}
#vol::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:12px; height:16px; background:var(--warm);
  border:1px solid #1b1833; cursor:pointer;
}
#vol::-moz-range-thumb{width:12px; height:16px; background:var(--warm); border:1px solid #1b1833; cursor:pointer;}
#vollabel{font-size:10.5px; color:var(--dim); min-width:26px; text-align:right;}

/* ---------- 状态机调试条 ---------- */
#debugbar{
  margin-top:10px; font-size:10.5px; color:var(--dim); border:2px dashed #3a3560;
  background:#15132b; padding:8px 10px; white-space:pre-wrap; line-height:1.6;
}
#debugbar b{color:var(--green);}
#debugbar .err{color:var(--red);}

.loadbtn{
  display:block; width:100%; margin-top:12px; cursor:pointer;
  border:2px dashed var(--line); background:transparent; color:var(--dim);
  font-family:var(--font); font-size:12px; padding:9px; text-align:center;
}
.loadbtn:hover{border-color:var(--green); color:var(--green);}
#menustat{font-size:11.5px; color:var(--dim); text-align:center; margin-top:6px; min-height:1.4em;}
.srcnote{font-size:10.5px; color:var(--dim); text-align:center; margin-top:4px;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar" class="hidden">
    <span>MIDNIGHT SNACK · 深夜进食 <span id="stname"></span></span>
    <div id="audiobar">
      <button id="mute" type="button">🔊</button>
      <input id="vol" type="range" min="0" max="100" value="60" title="音量">
      <span id="vollabel">60</span>
    </div>
  </div>
  <div id="hud" class="hidden"></div>
  <div id="stage"></div>
  <div id="debugbar" class="hidden"></div>
</div>

<!-- 可选：由 scripts/fetch-menu.mjs 生成的门店实时菜单（存在则覆盖内置快照） -->
<script src="menu.js"></script>
<script>
/* =========================================================
   深夜进食 Midnight Snack · v2.0.0
   单文件 · 无依赖 · 双击即玩

   ── 四项核心交互 ──
   1) 真实在售菜单：分类 / 售价 / 官方图片 / 官方配料（图片加载失败回退像素图占位）
   2) 同一份可点多份：点击 +1，弹跳 + 升调 + 连击文案
   3) 心情菜单：6 种心情各配一套搭配（正则匹配，门店叫法不同也不失效）
   4) 逐口进食：像素食物按层切 3–6 口，点哪块吃哪块；热量按实际吃掉的口数结算

   ── 流程闭环 ──
   全流程由显式状态机 FSM 驱动：每个动作都有前置条件 guard、
   状态流转 from → to、失败回滚 rollback。加 ?debug=1 可实时查看。

   ── 音效 ──
   Audio 子系统：8-bit 合成 + 主增益 + 压缩器 + 复音上限 + 同名节流；
   支持静音 / 音量滑块 / localStorage 记忆；外部音效资源缺失自动回退合成音。

   合规：不把「麦当劳 = 长胖」做归因；热量是会呼吸的数值玩具，不是道德审判。
   所有结局指向自我接纳，没有失败结局，没有最优解。
   ========================================================= */

/* ═══════════════════════════════════════════════════════
   0. 音效引擎 Audio
   链路：voice → masterGain → compressor → destination
   防爆音：每音都有 attack(8ms) + 指数释放；compressor 削峰；
           同名音效节流 THROTTLE；复音上限 MAX_VOICES，超出即丢弃。
   ═══════════════════════════════════════════════════════ */
const Audio = {
  ctx:null, master:null, comp:null,
  muted:false, volume:0.6, ok:false,
  voices:0, MAX_VOICES:10,
  lastAt:Object.create(null),
  samples:Object.create(null), sampleFail:false, sampleMode:'synth',

  THROTTLE:{ click:45, hover:90, add:40, remove:60, bite:70, gulp:120, tick:90, combo:60, error:200 },

  init(){
    if(this.ctx) return this.ok;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC){ this.ok=false; return false; }
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.comp = this.ctx.createDynamicsCompressor();
      this.comp.threshold.value=-18; this.comp.knee.value=12;
      this.comp.ratio.value=6; this.comp.attack.value=0.003; this.comp.release.value=0.15;
      this.master.gain.value = this.muted ? 0 : this.volume*0.6;
      this.master.connect(this.comp); this.comp.connect(this.ctx.destination);
      this.ok = true;
    }catch(e){ this.ok=false; }
    return this.ok;
  },
  resume(){ try{ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); }catch(e){} },
  setVolume(v){
    this.volume = Math.max(0, Math.min(1, v));
    try{ if(this.master) this.master.gain.value = this.muted?0:this.volume*0.6; }catch(e){}
    try{ localStorage.setItem('ms_vol', String(Math.round(this.volume*100))); }catch(e){}
  },
  setMuted(m){
    this.muted = !!m;
    try{ if(this.master) this.master.gain.value = this.muted?0:this.volume*0.6; }catch(e){}
    try{ localStorage.setItem('ms_mute', this.muted?'1':'0'); }catch(e){}
  },
  restore(){
    try{
      const v=localStorage.getItem('ms_vol'); if(v!=null) this.volume=Math.max(0,Math.min(1,(+v)/100));
      const m=localStorage.getItem('ms_mute'); if(m!=null) this.muted=(m==='1');
    }catch(e){}
  },
  /* 可选外部音效资源：设置 window.__MCD_SFX_BASE__ 指向目录 + manifest.json。
     加载失败（file:// 下很常见）→ sampleFail=true，全部回退合成音，不影响玩法。 */
  async preloadSamples(){
    const base = window.__MCD_SFX_BASE__;
    if(!base || !this.init()){ this.sampleMode='synth'; return; }
    try{
      const r = await fetch(base.replace(/\/$/,'')+'/manifest.json');
      if(!r.ok) throw new Error('HTTP '+r.status);
      const man = await r.json();
      await Promise.all(Object.keys(man).map(async n=>{
        try{
          const rr = await fetch(base.replace(/\/$/,'')+'/'+man[n]);
          this.samples[n] = await this.ctx.decodeAudioData(await rr.arrayBuffer());
        }catch(e){}
      }));
      this.sampleMode = Object.keys(this.samples).length ? 'sample' : 'synth';
    }catch(e){ this.sampleFail=true; this.sampleMode='synth'; }
  },
  tone(freq, dur, o){
    if(!this.ok || this.muted) return;
    if(this.voices >= this.MAX_VOICES) return;
    o = o || {};
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    if(o.slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(40,o.slideTo), t+dur);
    const peak = (o.gain==null?0.5:o.gain)*0.16;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t+(o.attack||0.008));
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    let node = osc;
    if(o.lp){ const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; node.connect(f); node=f; }
    node.connect(g); g.connect(this.master);
    this.voices++;
    osc.onended = ()=>{ this.voices = Math.max(0, this.voices-1); };
    osc.start(t); osc.stop(t+dur+0.02);
  },
  noise(dur, o){
    if(!this.ok || this.muted) return;
    if(this.voices >= this.MAX_VOICES) return;
    o = o || {};
    const t = this.ctx.currentTime;
    const len = Math.max(1, Math.floor(this.ctx.sampleRate*dur));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.freq||1200, t);
    if(o.slideTo) f.frequency.exponentialRampToValueAtTime(Math.max(80,o.slideTo), t+dur);
    f.Q.value = o.q || 1.2;
    const g = this.ctx.createGain();
    const peak = (o.gain==null?0.25:o.gain)*0.16;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t+(o.attack||0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    this.voices++;
    src.onended = ()=>{ this.voices = Math.max(0, this.voices-1); };
    src.start(t); src.stop(t+dur+0.02);
  },
  seq(notes, o){ o=o||{}; notes.forEach(([f,d,dl])=> setTimeout(()=> this.tone(f,d,o), dl||0)); },
  play(name, arg){
    if(!this.init() || this.muted) return;
    this.resume();
    const now = Date.now(), gap = this.THROTTLE[name];
    if(gap && now - (this.lastAt[name]||0) < gap) return;   // 节流：高频触发直接丢弃
    this.lastAt[name] = now;
    const buf = this.samples[name];
    if(buf){                                               // 外部资源命中则播放采样
      try{
        const s = this.ctx.createBufferSource(); s.buffer = buf;
        const g = this.ctx.createGain(); g.gain.value = 0.5;
        s.connect(g); g.connect(this.master); s.start(); return;

function artHTML(name, px){
  const rows = ART[name]; if(!rows) return '';
  let h = '<div class="art" style="--px:'+(px||7)+'px">';
  for(const r of rows) for(const ch of r) h += '<i style="background:'+(PAL[ch]||'transparent')+'"></i>';
  return h + '</div>';
}
function biteIndexAt(item, y){
  const bs = bitesOf(item);
  for(let i=0;i<bs.length;i++){ const r=bs[i].r; if(y>=r[0] && y<=r[1]) return i; }
  return -1;
}
function eatArtHTML(item, px){
  const rows = ART[item.art] || ART.burger;
  let h = '<div class="art big" id="eatar" style="--px:'+(px||15)+'px">';
  rows.forEach((row,y)=>{
    const b = biteIndexAt(item,y);
    for(let x=0;x<12;x++){
      const ch = row[x], dead = (ch==='.');
      h += '<i data-y="'+y+'" data-x="'+x+'" data-b="'+(dead?-1:b)+'"'+
           ' class="'+(dead?'dead':'hit')+'" style="background:'+(PAL[ch]||'transparent')+'"></i>';
    }
  });
  return h + '</div>';
}
function visibleCells(item, bi){
  const rows = ART[item.art] || ART.burger;
  const r = bitesOf(item)[bi].r;
  let n=0;
  for(let y=r[0]; y<=r[1] && y<rows.length; y++)
    for(let x=0;x<12;x++) if(rows[y][x] !== '.') n++;
  return n;
}

    if(Array.isArray(o)) obj = {items:o};
    else if(o && Array.isArray(o.items)) obj = o;
  }catch(e){
    const m = String(t).match(/__MCD_MENU__\s*=\s*(\{[\s\S]*?\}|\[[\s\S]*?\])\s*;?/);
    if(m){ try{ const v = JSON.parse(m[1]); obj = Array.isArray(v) ? {items:v} : v; }catch(e2){} }

/* ═══════════════════════════════════════════════════════
   4. 状态机 FSM
   每个 transition：from（前置状态）/ to / guard（业务前置）/ effect（副作用）
   · guard 失败 → 状态不变，返回原因
   · effect 抛错 → 自动回滚状态与数值（rollback）
   · 每次成功 dispatch 压入 undo 栈，可显式回退
   ═══════════════════════════════════════════════════════ */
const FSM = {
  state:'BOOT', undo:[], log:[], failMsg:'',
  TRANSITIONS:{
    BOOT_DONE:    {from:['BOOT'],       to:'TITLE'},
    START:        {from:['TITLE'],      to:'LEAVE'},
    CHOOSE_LEAVE: {from:['LEAVE'],      to:'ROUTE', guard:p=> p && p.i>=0 && p.i<3, fail:'下班选择越界'},
    CHOOSE_ROUTE: {from:['ROUTE'],      to:'PICK',  guard:p=> p && p.i>=0 && p.i<3, fail:'路线选择越界'},
    /* 注意：点单选态的份数存在 pickMenu() 的局部 qty 里，S.cart 要到 SUBMIT_ORDER 才写入。
       所以这两个 guard 必须读 payload 传进来的实时份数，不能读 S.cart。 */
    ADD_ITEM:     {from:['PICK'],       to:'PICK',
      guard:p=>{
        if(!p || !p.item) return false;
        if(p.item.status !== 'on-sale'){ FSM.failMsg='该餐品已售罄'; return false; }
        if((p.qty||0) >= MAX_QTY){ FSM.failMsg='单品上限 '+MAX_QTY+' 份，店员已经开始看你了'; return false; }
        return true; }},
    REMOVE_ITEM:  {from:['PICK'],       to:'PICK',
      guard:p=> (p && (p.qty||0)) > 0, fail:'份数已为 0'},
    APPLY_MOOD:   {from:['PICK'],       to:'PICK', guard:p=> !!(p && p.mood && moodOk(p.mood)), fail:'这家店配不出这个心情'},
    CLEAR_CART:   {from:['PICK'],       to:'PICK', guard:p=> (p && p.count)>0, fail:'购物车本来就是空的'},
    SUBMIT_ORDER: {from:['PICK'],       to:'CONFIRM'},                      // 空单是合法分支
    CONFIRM_DONE: {from:['CONFIRM'],    to:'KITCHEN', guard:()=>S.cart.length>0, fail:'订单为空，跳过制作'},
    /* 空手分支有三个入口：下单即空（CONFIRM）、缺料回退后剩 0 份（PICK）、后厨全被划掉（KITCHEN） */
    SKIP_TO_EXIT: {from:['CONFIRM','PICK'], to:'EXIT_EMPTY', guard:()=>S.cart.length===0, fail:'订单非空，不能走空手分支'},
    KITCHEN_CLEARED:{from:['KITCHEN'],  to:'EXIT_EMPTY', guard:()=>S.cart.length===0, fail:'还有餐品没被划掉'},
    COOK_SHORTAGE:{from:['KITCHEN'],    to:'KITCHEN'},                      // 缺料：在厨房态内标记并划掉一份
    SHORTAGE_ROLLBACK:{from:['KITCHEN'],to:'PICK',    guard:()=>S.cart.length>0, fail:'订单已空，改走空手结局'},
    COOK_DONE:    {from:['KITCHEN'],    to:'SERVE', guard:()=>KITCHEN.pending()===0, fail:'还有餐品没做完'},
    SERVE_DONE:   {from:['SERVE'],      to:'EAT', guard:()=>S.cart.length>0, fail:'没有可吃的东西'},
    EAT_BITE:     {from:['EAT'],        to:'EAT',
      guard:p=> !!(p && p.unit && !p.unit.eaten.has(p.bite)), fail:'这一口已经吃过了'},
    EAT_STOP:     {from:['EAT'],        to:'REVIEW'},
    EAT_FINISH:   {from:['EAT'],        to:'REVIEW'},
    EXIT_DONE:    {from:['EXIT_EMPTY'], to:'REVIEW'},
    REVIEW_DONE:  {from:['REVIEW'],     to:'BED', guard:p=> p && p.i>=0 && p.i<4, fail:'复盘选择越界'},
    BED_DONE:     {from:['BED'],        to:'RESULT', guard:p=> p && p.i>=0 && p.i<3, fail:'睡前选择越界'},
    LOAD_MENU:    {from:['TITLE','BOOT'], to:null}                          // 自环：不改状态
  },
  can(name, payload){
    const t = this.TRANSITIONS[name];
    if(!t){ this.failMsg='未知动作 '+name; return false; }
    if(t.from.indexOf(this.state) < 0){ this.failMsg='当前状态 '+this.state+' 不允许 '+name; return false; }
    if(t.guard && !t.guard(payload)){ this.failMsg = t.fail || '前置条件不满足'; return false; }
    return true;
  },
  dispatch(name, payload){
    const t = this.TRANSITIONS[name];
    if(!this.can(name, payload)){
      this.log.push('✗ '+name+' @'+this.state+' — '+this.failMsg);
      FSM.render();
      return {ok:false, reason:this.failMsg};
    }
    const from = this.state, snap = snapshot();
    this.undo.push({from, snap, name});
    if(t.to) this.state = t.to;
    try{
      if(t.effect) t.effect(payload);
      this.log.push('✓ '+name+' : '+from+' → '+this.state);
      FSM.render();
      return {ok:true};
    }catch(err){
      this.state = from; restore(snap); this.undo.pop();
      this.log.push('✗ '+name+' 异常已回滚 — '+err.message);
      FSM.render();
      return {ok:false, reason:'执行异常，已回滚：'+err.message, rolled:true};
    }
  },
  rollback(){
    const u = this.undo.pop();
    if(!u) return false;
    this.state = u.from; restore(u.snap);
    this.log.push('↩ rollback '+u.name+' → '+this.state);
    FSM.render();
    return true;
  },
  render(){
    const el = document.getElementById('debugbar');
    if(!el || !DEBUG) return;
    el.classList.remove('hidden');
    el.innerHTML = '<b>FSM</b> state=' + this.state + ' · undo=' + this.undo.length +
      ' · voices=' + Audio.voices + ' · sfx=' + Audio.sampleMode +
      (Audio.sampleFail ? '（资源缺失，已回退合成）' : '') +
      '\n' + this.log.slice(-6).map(l => l[0]==='✗' ? '<span class="err">'+l+'</span>' : l).join('\n');
  }
};

const STATS = [

function renderHUD(){
  const hud=document.getElementById('hud');
  hud.innerHTML = STATS.map(s=>{
    const v=Math.max(0,Math.min(s.max,S[s.k]));
    return '<div class="stat"><div class="k">'+s.label+'</div><div class="v">'+Math.round(S[s.k])+'</div>'+
      '<div class="bar"><span style="width:'+(v/s.max*100)+'%;background:'+s.color+'"></span></div></div>';
  }).join('') +
  '<div class="stat"><div class="k">体重</div><div class="v">'+S.weight.toFixed(2)+' kg</div>'+
    '<div class="bar"><span style="width:60%;background:var(--pink)"></span></div></div>'+
  '<div class="stat"><div class="k">今日热量</div><div class="v">'+Math.round(S.kcal)+' kcal</div>'+
    '<div class="bar"><span style="width:'+Math.min(100,S.kcal/2200*100)+'%;background:var(--warm)"></span></div></div>';
}
function popStat(key, delta){
  const idx = STATS.findIndex(s=>s.k===key);
  const el = document.getElementById('hud').children[idx];
  if(!el || !delta) return;
  const p=document.createElement('span');
  p.className='pop';
  p.style.color = delta>0 ? 'var(--green)' : 'var(--red)';
  p.textContent = (delta>0?'+':'')+Math.round(delta);
  el.appendChild(p);
  setTimeout(()=>p.remove(),1100);
}
function apply(fx){
  for(const k in fx){
    if(k==='indulgence'||k==='acceptance'){ S[k]+=fx[k]; continue; }
    if(k==='flag'){ S.flags[fx[k]]=true; continue; }
    if(k==='weight'){ S.weight += fx[k]; continue; }
    if(k==='kcal'){ S.kcal += fx[k]; continue; }
    S[k] = Math.max(0, Math.min(100, S[k] + fx[k]));
    popStat(k, fx[k]);
  }
  renderHUD();
}

let typer=null;
function typeInto(el, text){
  return new Promise(res=>{
    el.textContent=''; let i=0;
    const done=()=>{ if(typer){clearInterval(typer.t); typer=null;} el.textContent=text; renderHUD(); res(); };
    typer={done};
    typer.t=setInterval(()=>{ el.textContent = text.slice(0,++i); if(i>=text.length) done(); }, 22);
  });
}

    if(!o.choices){
      const cont = document.createElement('button');
      cont.className='primary'; cont.textContent='继续 →';
      stage.querySelector('.panel').appendChild(cont);
      cont.onclick=()=>{ Audio.play('click'); res({i:0}); };
      return;
    }
    const box = document.getElementById('ch');
    o.choices.forEach((c,idx)=>{
      const b=document.createElement('button');
      b.innerHTML = c.label + (c.tag ? '<span class="tag">'+c.tag+'</span>' : '');
      b.onmouseenter = ()=> Audio.play('hover');
      b.onclick = ()=>{
        if(typer) typer.done();
        Audio.play('click');
        if(c.fx) apply(c.fx);
        if(c.sfx) c.sfx();
        res({i:idx, c});
      };
      box.appendChild(b);
    });
  });
}

      '</div>';

    const moodBox=document.getElementById('moods'), mdesc=document.getElementById('mdesc'),
          tabsBox=document.getElementById('tabs'), box=document.getElementById('cards'),
          cartEl=document.getElementById('cart');

    MOODS.forEach(m=>{
      const c=document.createElement('button');
      c.className='chip'+(moodOk(m)?'':' no');
      c.textContent=m.name; c.style.width='auto'; c.style.boxShadow='2px 2px 0 rgba(0,0,0,.35)';
      if(moodOk(m)) c.onclick=()=>{
        const r = FSM.dispatch('APPLY_MOOD', {mood:m});
        if(!r.ok){ Audio.play('error'); flash(r.reason); return; }
        Audio.play('mood');
        qty.clear();
        m.need.forEach(k=>{ const it=findByKw(k); if(it) qty.set(it.id,(qty.get(it.id)||0)+1); });
        [...moodBox.children].forEach(x=>x.classList.remove('on'));
        c.classList.add('on');
        mdesc.innerHTML = '<b>'+m.set+'</b>\n'+m.desc;
        renderCards(); renderCart();
      }; else c.title='这家店现在配不出这个心情';
      moodBox.appendChild(c);
    });

    function renderTabs(){
      tabsBox.innerHTML='';
      cats.forEach(name=>{
        const b=document.createElement('button');
        b.className='tab'+(cat===name?' on':''); b.textContent=name;
        b.style.width='auto'; b.style.padding='5px 11px'; b.style.fontSize='12px';
        b.onclick=()=>{ cat=name; Audio.play('click'); renderTabs(); renderCards(); };
        tabsBox.appendChild(b);
      });
    }
    function thumbHTML(m){
      /* 官方图片优先；无图时直接用像素图占位 */
      return m.image
        ? '<div class="thumb"><img src="'+m.image+'" alt="'+m.name+'" loading="lazy"></div>'
        : '<div class="thumb">'+artHTML(m.art,5)+'</div>';
    }
    /* 图片加载失败（离线 / 图片墙）→ 回退像素图。
       必须用 JS 绑定：内联 onerror 里塞 HTML 会被双引号截断。 */
    function bindThumbFallback(cardEl, m){
      const img = cardEl.querySelector('.thumb img');
      if(img) img.onerror = ()=>{ img.parentNode.innerHTML = artHTML(m.art, 5); };
    }
    function renderCards(){
      box.innerHTML='';
      const list = MENU.filter(m => cat==='全部' || m.category===cat);
      if(!list.length){ box.innerHTML='<div style="color:var(--dim);font-size:12px;padding:8px">这个分类今晚没有在售的。</div>'; return; }
      list.forEach(m=>{
        const n = qty.get(m.id)||0;
        const c=document.createElement('div');
        c.className='card'+(n>0?' on':'');
        const ings = m.ingredients.length
          ? '<div class="ings"><b>配料</b> '+m.ingredients.join(' · ')+
            (m.ingSource==='manual'?' <span style="color:var(--red)">*</span>':'')+'</div>'
          : '<div class="ings" style="color:#665f92">配料未提供</div>';
        c.innerHTML =
          (n>0 ? '<span class="qty">×'+n+'</span><span class="minus" data-id="'+m.id+'">−</span>' : '')+
          thumbHTML(m)+
          '<div class="nm">'+m.name+'</div>'+
          '<div class="cat">'+m.category+'</div>'+
          '<span class="mt">'+m.note+'</span>'+
          '<span class="kc">¥'+m.price.toFixed(1)+' · '+m.kcal+' kcal · 蛋白'+fmtN(m.nutrition.protein)+'g</span>'+
          ings;
        bindThumbFallback(c, m);
        c.onclick=(ev)=>{
          if(ev.target.classList.contains('minus')) return;
          const r = FSM.dispatch('ADD_ITEM', {item:m, qty:qty.get(m.id)||0});
          if(!r.ok){ Audio.play('error'); flash(r.reason); return; }
          const cur=(qty.get(m.id)||0);
          qty.set(m.id, cur+1);
          Audio.play('add', cur+1);
          c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
          [...moodBox.children].forEach(x=>x.classList.remove('on'));
          mdesc.innerHTML = comboTip(m, cur+1);
          renderCards(); renderCart();
        };
        const mn=c.querySelector('.minus');
        if(mn) mn.onclick=(ev)=>{
          ev.stopPropagation();
          const r = FSM.dispatch('REMOVE_ITEM', {id:m.id, qty:qty.get(m.id)||0});
          if(!r.ok){ Audio.play('error'); flash(r.reason); return; }
          const cur=(qty.get(m.id)||0);
          if(cur>1) qty.set(m.id,cur-1); else qty.delete(m.id);
          Audio.play('remove');
          renderCards(); renderCart();
        };
        box.appendChild(c);
      });
    }
    function fmtN(v){ return v==null?'-':v; }
    function comboTip(m,n){
      return ['第 '+n+' 份'+m.name+'。你确定吗？确定就行。',
              '第 '+n+' 份。你的手比你的理智先做了决定。',
              '第 '+n+' 份'+m.name+' —— 这个数量已经可以被写进用户画像了。',
              '第 '+n+' 份。你在用点击填补某种东西，这没什么好羞耻的。'][Math.min(n-1,3)];
    }
    function flash(t){ mdesc.innerHTML='<span class="flash">'+t+'</span>'; }
    function renderCart(){
      const items = MENU.filter(m=>qty.get(m.id));
      if(!items.length){ cartEl.innerHTML='<span style="color:var(--dim)">购物车是空的。点上面的卡片，或者什么都不点直接走。</span>'; return; }
      cartEl.innerHTML =
        '<span class="it"><em>'+items.map(m=>m.name+(qty.get(m.id)>1?'×'+qty.get(m.id):'')).join(' · ')+'</em></span>'+
        '<span>份数 <b>'+items.reduce((a,m)=>a+qty.get(m.id),0)+'</b></span>'+
        '<span>合计 <b>¥'+items.reduce((a,m)=>a+m.price*qty.get(m.id),0).toFixed(1)+'</b></span>'+
        '<span>热量 <b>'+items.reduce((a,m)=>a+m.kcal*qty.get(m.id),0)+' kcal</b></span>';
    }

    document.getElementById('clear').onclick=()=>{
      const r = FSM.dispatch('CLEAR_CART', {count: qty.size});
      if(!r.ok){ Audio.play('error'); flash(r.reason); return; }
      qty.clear(); Audio.play('remove'); renderCards(); renderCart();
      [...moodBox.children].forEach(x=>x.classList.remove('on'));
      mdesc.textContent='清空了。可以重新来一次。';
    };
    document.getElementById('ok').onclick=()=>{
      const r = FSM.dispatch('SUBMIT_ORDER');
      if(!r.ok){ Audio.play('error'); flash(r.reason); return; }
      S.cart = MENU.filter(m=>qty.get(m.id)).map(m=>({item:m, qty:qty.get(m.id)}));
      Audio.play('order');
      res();
    };

    renderTabs(); renderCards(); renderCart();
    if(carried){
      mdesc.innerHTML = '<span class="flash">刚才那份被划掉了，剩下的还在这儿 —— 可以接着加，也可以直接走。</span>';
    }
  });
}

/* ═══════════════════════════════════════════════════════
   8. 后厨 KITCHEN：制作 → 成功 / 重做 / 缺料回滚 → 出餐
   ═══════════════════════════════════════════════════════ */
const KITCHEN = {
  units:[], idx:0,
  build(){
    this.units = [];
    S.cart.forEach(c=>{ for(let i=0;i<c.qty;i++) this.units.push({item:c.item, status:'wait', msg:'等待制作'}); });
    this.idx = 0;
  },
  pending(){ return this.units.filter(u=>u.status==='wait').length; },
  /* 缺料：从订单移除一份。cart / 花费 / 热量口径由 cartPrice() 等实时派生，天然一致 */
  refund(u){
    const c = S.cart.find(x=>x.item.id===u.item.id);
    if(!c) return;
    c.qty -= 1;
    if(c.qty <= 0) S.cart = S.cart.filter(x=>x!==c);
    S.shortage++;
  }
};
const REMARK = {
  ok:['做好了。','出锅，装盒。','这一个是完整的。'],
  remake:['掉地上了 —— 后厨重做了一份。','第一份没成型，第二份才像个样子。','机器卡了一下，重来。'],
  shortage:['卖完了。最后一份被前面那个人拿走了。','缺料。这个点厨房也只剩半成品了。']
};
function kitchenStage(){
  return new Promise(res=>{
    showTop();
    KITCHEN.build();
    if(!KITCHEN.units.length){ res({empty:true}); return; }

    stage.innerHTML =
      '<div class="panel">'+artHTML('door',7)+
      '<div class="scene-text">订单进了后厨。\n你能听见油锅的声音，和某个定时器在响。\n\n这个环节没有人会问你要不要加料 —— 这就是它可爱的地方。</div>'+
      '<div class="kitchen" id="klist"></div>'+
      '<div class="kbar"><span id="kbar" style="width:0%"></span></div>'+
      '<div class="eat-tip" id="ktip">后厨接单中……</div>'+
      '<div class="row hidden" id="krow">'+
        '<button class="primary" id="kagain">换一个</button>'+
        '<button class="ghost" id="kok">就这样吧</button></div>'+
      '</div>';

    const list=document.getElementById('klist'), bar=document.getElementById('kbar'),
          tip=document.getElementById('ktip'), row=document.getElementById('krow');
    renderList();
    Audio.play('cookStart');
    next();

    function renderList(){
      list.innerHTML = KITCHEN.units.map(u=>{
        const cls = u.status==='ok'?'ok':(u.status==='wait'?'':(u.status==='remake'?'warn':'bad'));
        const mark = u.status==='ok'?'✓':(u.status==='wait'?'…':(u.status==='remake'?'↻':'✕'));
        return '<div class="krow '+cls+'"><span>'+mark+'</span><span class="kn">'+u.item.name+'</span>'+
               '<span class="ks">'+u.msg+'</span></div>';
      }).join('');
      const fin = KITCHEN.units.filter(u=>u.status!=='wait').length;
      bar.style.width = (fin/KITCHEN.units.length*100)+'%';
    }
    function next(){
      const u = KITCHEN.units[KITCHEN.idx];
      if(!u){ serve(); return; }
      tip.textContent = '正在制作：'+u.item.name+' …';
      const tick = setInterval(()=> Audio.play('tick'), 320);
      setTimeout(()=>{
        clearInterval(tick);
        const r = Math.random();
        const status = r < 0.06 ? 'shortage' : (r < 0.16 ? 'remake' : 'ok');
        u.status = status;
        u.msg = REMARK[status][Math.floor(Math.random()*REMARK[status].length)];

        if(status === 'shortage'){
          Audio.play('error');
          const rr = FSM.dispatch('COOK_SHORTAGE', {unit:u});
          if(!rr.ok){ tip.textContent = rr.reason; KITCHEN.idx++; setTimeout(next,600); return; }
          KITCHEN.refund(u);                                   // 失败回滚：划掉这一份
          S.mood = Math.max(0, S.mood-2); S.anxiety = Math.min(100, S.anxiety+3);
          renderHUD(); renderList();
          row.classList.remove('hidden');
          tip.innerHTML = '<b>'+u.item.name+'</b> '+u.msg+'\n已经从订单里划掉了，钱不会收你的。';
          document.getElementById('kagain').onclick = ()=>{
            Audio.play('click'); res({shortage:true, item:u.item});   // 回退到点单重选
          };
          document.getElementById('kok').onclick = ()=>{
            Audio.play('click'); row.classList.add('hidden');
            KITCHEN.idx++; renderList(); setTimeout(next,350);
          };
          return;
        }
        if(status === 'remake'){
          Audio.play('cookFail'); S.remake++; renderList();
          setTimeout(()=>{ Audio.play('cookSuccess'); u.status='ok'; u.msg='重做完成。';
                           renderList(); KITCHEN.idx++; setTimeout(next,320); }, 850);
          return;
        }
        Audio.play('cookSuccess'); renderList(); KITCHEN.idx++; setTimeout(next,320);
      }, 900 + Math.random()*400);
    }
    function serve(){
      if(!S.cart.length){ res({empty:true}); return; }
      const r = FSM.dispatch('COOK_DONE');
      if(!r.ok){ tip.textContent = r.reason; return; }
      tip.textContent = '全部制作完成。';
      Audio.play('serve');
      setTimeout(()=> res({served:true}), 700);
    }
  });
}

/* ═══════════════════════════════════════════════════════
   9. 进食 EAT
   ═══════════════════════════════════════════════════════ */
const DONE_LINES = ['吃完了。你甚至没有抬头。',
  '空了。你盯着盒子看了两秒，像在看一段跑完的日志。',
  '最后一口总是最好吃，也总是最舍不得。',
  '没了。你的手还在空中停了一下。'];
function eatStage(){
  return new Promise(res=>{
    const units=[];
    S.cart.forEach(c=>{ for(let i=0;i<c.qty;i++) units.push(c.item); });
    if(!units.length){ res(); return; }
    showTop();

    let ui=0, combo=0, lastT=0, stopped=false, finished=false, cur=null;
    const totalBites = units.reduce((a,it)=>a+bitesOf(it).length,0);
    let doneBites = 0;

    stage.innerHTML =
      '<div class="panel">'+
      '<div class="eat-head" id="ehead"></div>'+
      '<div class="artwrap" id="ewrap"></div>'+
      '<div class="eat-tip" id="etip"></div>'+
      '<div class="eat-bar"><span id="ebar" style="width:0%"></span></div>'+
      '<div class="row"><button class="ghost" id="stop">放下，不吃了</button><button class="ghost" id="all">整份吃完</button></div>'+
      '</div>';

    const head=document.getElementById('ehead'), wrap=document.getElementById('ewrap'),
          tip=document.getElementById('etip'), bar=document.getElementById('ebar');

    function renderUnit(){
      cur = { item: units[ui], eaten:new Set() };
      const bs = bitesOf(cur.item);
      bs.forEach((b,i)=>{ if(visibleCells(cur.item,i)===0) cur.eaten.add(i); });  // 空口自动跳过，防卡死
      head.innerHTML = '第 <b>'+(ui+1)+'</b> / '+units.length+' 份 · <b>'+cur.item.name+'</b>';
      wrap.innerHTML = eatArtHTML(cur.item, 15);
      bind(); updateTip();
      if(cur.eaten.size>=bs.length) setTimeout(unitDone, 400);
    }
    function bind(){
      wrap.querySelectorAll('#eatar i[data-b]').forEach(cell=>{
        cell.onclick = ()=>{
          const b = +cell.dataset.b;
          if(b < 0 || finished) return;
          const r = FSM.dispatch('EAT_BITE', {unit:cur, bite:b});
          if(!r.ok){ Audio.play('error'); return; }         // 重复点击被状态机拦下，不进数值
          eatBite(b, cell);
        };
      });
    }
    function eatBite(b, cell){
      const myUnit = cur, bs = bitesOf(cur.item);
      cur.eaten.add(b); doneBites++;
      const w = bs[b].w;
      const dKcal = cur.item.kcal * w;
      const dJoy  = cur.item.joy * w * 1.15;

      wrap.querySelectorAll('#eatar i[data-b="'+b+'"]').forEach(c=> c.classList.add('gone'));
      crumbs(cell);
      const ar = wrap.querySelector('#eatar');
      if(ar){ ar.classList.remove('chomp'); void ar.offsetWidth; ar.classList.add('chomp'); }

      const now = Date.now();
      combo = (now - lastT < 1300) ? combo+1 : 1; lastT = now;
      if(combo>=3) Audio.play('combo', combo);
      if(cur.item.art==='cola'||cur.item.art==='coffee'||cur.item.art==='bottle') Audio.play('gulp');
      else Audio.play('bite', combo);

      apply({ kcal:dKcal, weight:dKcal/7700, satisfaction:dJoy,
              mood:dJoy*0.30, anxiety:-dJoy*0.22, energy:dJoy*0.08, indulgence:dKcal/16 });
      if(cur.eaten.size===1) S.eatenItems.push(cur.item);
      S.eatenKcal += dKcal;

      floatText(cell, '+满足'+Math.round(dJoy)+'  '+Math.round(dKcal)+' kcal');
      updateTip(true);
      bar.style.width = Math.min(100, doneBites/totalBites*100)+'%';
      if(myUnit===cur && cur.eaten.size >= bs.length) setTimeout(unitDone, 620);
    }
    function updateTip(justAte){
      const bs = bitesOf(cur.item);
      const left = bs.length - cur.eaten.size;
      if(left <= 0) return;
      let t = '还剩 <b>'+left+'</b> 口 · 点它，一口一口吃';
      if(justAte){
        const b = bs[[...cur.eaten][cur.eaten.size-1]];
        const ing = cur.item.ingredients.length
          ? '\n<span class="ing">这一口里有：'+cur.item.ingredients.slice(0,3).join(' · ')+'</span>' : '';
        t = '刚刚吃掉：<b>'+b.label+'</b>\n还剩 <b>'+left+'</b> 口'+ing;
      }
      if(combo>=3) t += '\n<span class="cmb">连击 ×'+combo+' · 你在用速度证明什么</span>';
      tip.innerHTML = t;
    }
    function floatText(cell, txt){
      const p=document.createElement('span'); p.className='bite-pop'; p.textContent=txt;
      p.style.left=(cell.offsetLeft-10)+'px'; p.style.top=(cell.offsetTop-14)+'px';
      wrap.appendChild(p); setTimeout(()=>p.remove(),1000);
    }
    function crumbs(cell){
      const cols=['#ffcc4d','#e8452c','#f4f1ea','#8b5a2b'];
      for(let i=0;i<6;i++){
        const c=document.createElement('span'); c.className='crumb';
        c.style.background=cols[i%cols.length];
        c.style.left=(cell.offsetLeft+4)+'px'; c.style.top=(cell.offsetTop+4)+'px';
        c.style.setProperty('--dx',((Math.random()*2-1)*46).toFixed(0)+'px');
        c.style.setProperty('--dy',(14+Math.random()*36).toFixed(0)+'px');
        c.style.animationDelay=(i*22)+'ms';
        wrap.appendChild(c); setTimeout(()=>c.remove(),800);
      }
    }
    function unitDone(){
      if(finished) return;
      tip.innerHTML = DONE_LINES[Math.min(ui, DONE_LINES.length-1)];
      if(ui+1 < units.length) setTimeout(()=>{ ui++; renderUnit(); }, 950);
      else finishAll();
    }
    function finishAll(){
      finished = true;
      wrap.innerHTML = artHTML('moon', 12);
      head.innerHTML = stopped ? '你放下了。' : '吃完了。';
      tip.innerHTML = stopped
        ? '你把剩下的留在盒子里。\n盒子还温着，你没有再看它第二眼。\n\n这不是失败 —— 这叫<b>知道自己够了</b>。'
        : '全吃完了。\n你把包装纸叠成了一个小方块 ——\n这是你今晚唯一完成度 100% 的东西。';
      document.getElementById('stop').classList.add('hidden');
      document.getElementById('all').classList.add('hidden');
      const p = stage.querySelector('.panel'), b = document.createElement('button');
      b.className='primary'; b.textContent='继续 →';
      b.onclick=()=>{ Audio.play('click'); FSM.dispatch(stopped?'EAT_STOP':'EAT_FINISH'); res(); };
      p.appendChild(b);
    }
    document.getElementById('all').onclick=()=>{
      if(finished) return;
      const bs = bitesOf(cur.item); let d=0;
      bs.forEach((b,i)=>{
        if(cur.eaten.has(i)) return;
        setTimeout(()=>{
          if(finished || !cur) return;
          if(!FSM.dispatch('EAT_BITE', {unit:cur, bite:i}).ok) return;
          const cell = wrap.querySelector('#eatar i[data-b="'+i+'"]:not(.gone)');
          if(cell) eatBite(i, cell);
        }, d++ * 90);
      });
    };
    document.getElementById('stop').onclick=()=>{
      if(finished) return;
      stopped = true; S.halfStop = true;
      apply({acceptance:+8, anxiety:+5});
      Audio.play('click'); finishAll();
    };
    renderUnit();
  });
}

/* ═══════════════════════════════════════════════════════
   10. 结局
   ═══════════════════════════════════════════════════════ */
function ending(){
  const ind=S.indulgence, acc=S.acceptance;
  const hi = ind>=58, mid = ind>=30, aHi = acc>=55;
  let e;
  if(hi && aHi)       e = E.legalHigh;
  else if(hi && !aHi) e = E.guilt;
  else if(mid && aHi) e = E.justRight;
  else if(mid && !aHi)e = E.meh;
  else if(aHi)        e = E.gentle;
  else                e = E.ascetic;

  const kinds = S.cart.length, st = S.start || snapshot();
  const d = {
    energy:S.energy-st.energy, mood:S.mood-st.mood,
    anxiety:S.anxiety-st.anxiety, satisfaction:S.satisfaction-st.satisfaction,
    weight:S.weight-st.weight, kcal:S.kcal-st.kcal
  };
  const fmt=(v,u)=>'<div>'+u+' <b style="color:'+(v>0?'var(--green)':(v<0?'var(--red)':'var(--dim)'))+'">'+
    (v>0?'+':'')+(u==='kg'?v.toFixed(3):Math.round(v))+'</b></div>';

  document.getElementById('hud').classList.add('hidden');
  stage.innerHTML =
    '<div class="panel center">'+artHTML(e.art,8)+
    '<div class="badge">'+e.badge+'</div>'+
    '<div class="end-title">'+e.title+'</div>'+
    '<div class="end-body" style="text-align:left">'+e.body+'</div>'+
    '<div class="delta">'+fmt(d.energy,'精力')+fmt(d.mood,'心情')+fmt(d.anxiety,'焦虑')+
      fmt(d.satisfaction,'满足感')+fmt(d.weight,'kg')+fmt(d.kcal,'kcal')+'</div>'+
    '<div class="note">'+e.note+'</div>'+
    (kinds>=4?'<div class="note" style="border-color:var(--green);color:var(--green)">🏆 隐藏成就 · 全家桶工程师：你把菜单点成了全量覆盖测试。</div>':'')+
    (S.halfStop?'<div class="note" style="border-color:var(--blue);color:var(--blue)">🏆 隐藏成就 · 未完成的 commit：你留了半盒在桌上。这不是 bug，是 feature。</div>':'')+
    (S.shortage?'<div class="note" style="border-color:var(--warm);color:var(--warm)">🏆 隐藏成就 · 404 Not Found：'+S.shortage+' 份餐品在厨房里消失了，你接受了这件事。</div>':'')+
    (cartPrice()>0?'<div class="warn" style="margin-top:10px">今晚在这家店花了 ¥'+cartPrice().toFixed(1)+'（门店实时售价）</div>':'')+
    '<div class="row"><button class="primary" id="cp">复制结局卡</button><button id="again">再玩一次</button></div>'+
    '<div class="warn">本局没有评分，没有最优解。放纵和克制都不是错误答案。</div>'+
    '</div>';
  Audio.play('ending');
  if(kinds>=4 || S.halfStop || S.shortage) setTimeout(()=>Audio.play('unlock'), 900);
  const text = '【深夜进食 · '+e.title+'】\n'+e.body+'\n—— '+e.note+'\n今晚：精力 '+fmtNum(d.energy)+
    ' 心情 '+fmtNum(d.mood)+' 焦虑 '+fmtNum(d.anxiety)+' 满足感 '+fmtNum(d.satisfaction)+
    ' 体重 '+(d.weight>=0?'+':'')+d.weight.toFixed(3)+'kg';
  document.getElementById('cp').onclick=()=>{
    navigator.clipboard?.writeText(text).then(()=>{
      document.getElementById('cp').textContent='已复制到剪贴板 ✓'; Audio.play('coin');
    }).catch(()=>{ document.getElementById('cp').textContent='复制失败，手动选吧'; });
  };
  document.getElementById('again').onclick=()=>location.reload();
}
function fmtNum(v){ return (v>0?'+':'')+Math.round(v); }

/* ═══════════════════════════════════════════════════════
   11. 主流程 RUN（状态机驱动）
   ═══════════════════════════════════════════════════════ */
async function run(){
  FSM.dispatch('BOOT_DONE');        // BOOT → TITLE（菜单就绪后才进入标题态）
  await title();
  S.start = snapshot();
  renderHUD();

  /* LEAVE */
  FSM.dispatch('START');
  const a1 = await scene({ art:'dev',
    text:'22:47。\n\n工位区的灯灭了一半，你的屏幕还亮着。\n今天的第 4 个线上问题，刚刚被你 hotfix 掉。\n\n你合上电脑。肩膀像被压了两百个 commit。\n\n现在，怎么办？',
    choices:[
      {label:'站起来，下楼走走', tag:'身体比脑子先动了', fx:{energy:-3,mood:+4,flag:'down'}},
      {label:'直接回家，路上再说', tag:'地铁还有末班车', fx:{energy:-6,anxiety:+3,flag:'home'}},
      {label:'再刷十分钟手机，缓冲一下', tag:'你管这叫 decompression', fx:{mood:-3,anxiety:+4,energy:-4,flag:'phone'}}]});
  FSM.dispatch('CHOOSE_LEAVE', {i:a1.i});

  /* ROUTE */
  const routeText = {
    down:'电梯降到 1 层。\n地铁口那家店还亮着灯，\n你还没看见招牌，就先闻到了炸薯条的味道。\n—— 嗅觉是不讲道理的，它绕过了你的意志力。',
    home:'地铁上你打开了外卖 App。\n它在你最脆弱的 0.3 秒里，\n精准地弹出了「夜宵专区」。\n\n算法比你妈还了解你。',
    phone:'你本想刷十分钟就走。\n但算法比你更懂你自己：\n第一条是猫，第二条是新闻，\n第三条 —— 是炸鸡。'
  }[ S.flags.down?'down':(S.flags.home?'home':'phone') ];
  const a2 = await scene({ art:'door', text: routeText + '\n\n所以。今晚吃，还是不吃？',
    choices:[
      {label:'吃。今天已经够苦了。', tag:'情绪优先', fx:{mood:+6,anxiety:-4,acceptance:+6,indulgence:+6}},
      {label:'不吃。明天还要看体检报告。', tag:'理智优先', fx:{mood:-5,anxiety:+3,acceptance:-2}},
      {label:'先看看有什么，再说。', tag:'你其实已经有答案了', fx:{acceptance:+3,indulgence:+2}}]});
  FSM.dispatch('CHOOSE_ROUTE', {i:a2.i});

  /* PICK → CONFIRM → KITCHEN → SERVE → EAT（缺料可回退到 PICK 重选） */
  let redo = true;
  while(redo){
    redo = false;
    await pickMenu();

    if(S.cart.length === 0){
      FSM.dispatch('SKIP_TO_EXIT');
      await scene({ art:'moon',
        text:'你在点单机前站了很久，最后什么都没选。\n\n走出门的时候，风有点凉。\n你回头看了一眼灯牌，觉得它像在挽留你，\n也像在嘲笑你。\n\n其实都没有。它只是一块灯牌。'});
      FSM.dispatch('EXIT_DONE');
    }else{
      FSM.dispatch('CONFIRM_DONE');
      apply({mood:+3, anxiety:-2});                 // 下单那一刻的期待感，热量还没进肚子
      const names = S.cart.map(c=>c.item.name+(c.qty>1?'×'+c.qty:'')).join(' · ');
      await scene({ art:S.cart[0].item.art,
        text:'你点了：'+names+'\n合计 ¥'+cartPrice().toFixed(1)+' · '+cartKcal()+' kcal · '+cartQty()+' 份\n\n收银员抬头问了一句：\n「加 3 元换成大份薯条吗？」\n\n这是今晚最狡猾的一个问题。',
        choices:[
          {label:'换！都这个点了', tag:'反正已经破防了', fx:{indulgence:+16,kcal:+180,satisfaction:+10,mood:+4,weight:180/7700}},
          {label:'不用了，谢谢', tag:'守住原样', fx:{acceptance:+5}},
          {label:'能不能换成小份？', tag:'你知道这个选项存在',
           fx:{indulgence:-8, kcal:-Math.min(90, Math.round(cartKcal()*0.25)),
               weight:-Math.min(90, Math.round(cartKcal()*0.25))/7700, acceptance:+7, satisfaction:-3}}]});

      const k = await kitchenStage();
      if(k.empty){
        /* 后厨把订单清空了 → KITCHEN → EXIT_EMPTY → REVIEW，不允许直接跳 REVIEW */
        FSM.dispatch('KITCHEN_CLEARED');
        await scene({art:'moon', text:'后厨把最后一份也卖完了。\n\n你站在取餐台前，什么都没等到。\n\n有时候一整个系统都会 404，\n这不怪你，也不怪厨师。'});
        FSM.dispatch('EXIT_DONE');
      }else if(k.shortage){
        if(S.cart.length === 0){
          FSM.dispatch('KITCHEN_CLEARED');
          await scene({art:'moon', text:'唯一的那份也没了。\n\n你盯着取餐台看了一会儿，\n像在等一个永远不会返回的 Promise。\n\n然后你转身走了。'});
          FSM.dispatch('EXIT_DONE');
        }else{
          /* 明确的失败回退：KITCHEN → PICK，剩下的份数原样带回点单界面 */
          FSM.dispatch('SHORTAGE_ROLLBACK');
          await scene({art:'door', text:'那么，换个别的？\n\n（刚才那份已经划掉了，钱不会收。剩下的还在单子里。）'});
          redo = true; continue;
        }
      }else{
        await serveStage();
        await eatStage();
      }
    }
  }

  /* 搭配命名 */
  if(S.eatenItems.length){
    const cn = comboNameOf(S.eatenItems, S.eatenKcal);
    await scene({ art:'heart',
      text:'顺便统计一下你今晚的搭配：\n\n【'+cn.n+'】\n'+cn.d+'\n\n（这份命名没有任何科学依据，\n就像你今晚做的很多决定一样。）' });
  }

  /* REVIEW */
  const a3 = await scene({ art:'storm',
    text:'然后，那个声音来了。\n\n你还没到家，脑子里已经自动跑起一场 code review ——\n评审对象是你自己。\n\n你会对自己说什么？',
    choices:[
      {label:'「我今天值得这一顿。」', tag:'自我接纳', fx:{acceptance:+28,anxiety:-16,mood:+9}},
      {label:'「完了，明天的体重……」', tag:'自我审判', fx:{acceptance:-24,anxiety:+14,mood:-7}},
      {label:'「明天多走两站路就好了。」', tag:'交易型和解', fx:{acceptance:+6,anxiety:-4,mood:+2}},
      {label:'「算了，反正已经吃了。」', tag:'摆烂，但摆得挺平', fx:{acceptance:+2,anxiety:+3,mood:-2}}]});
  FSM.dispatch('REVIEW_DONE', {i:a3.i});

  /* BED */
  const a4 = await scene({ art:'bed',
    text:'你刷完牙，躺下了。\n\n天花板是黑的，手机屏幕是亮的。\n今晚的最后一个念头，你想留给什么？',
    choices:[
      {label:'设个明早的闹钟，去跑两公里', tag:'给明天的自己留个承诺', fx:{acceptance:+10,anxiety:-8,energy:-3}},
      {label:'把明天的早餐加进购物车', tag:'你在照顾未来的自己', fx:{acceptance:+12,mood:+6,anxiety:-6,indulgence:+4}},
      {label:'什么都不想了，先睡', tag:'这才是真正的 hotfix', fx:{acceptance:+16,anxiety:-14,mood:+5,energy:+8}}]});
  FSM.dispatch('BED_DONE', {i:a4.i});

  ending();
}

/* ---------- 标题界面 ---------- */
function title(){
  return new Promise(res=>{
    const srcTxt = MENU_SRC==='injected' ? '★ 门店实时菜单'
                 : MENU_SRC==='file'     ? '★ 已载入你选择的菜单文件'
                 : '内置快照（最近一次真实在售数据）';
    stage.innerHTML =
      '<div class="panel center">'+artHTML('moon',9)+
      '<h1>深夜进食</h1>'+
      '<div class="sub">MIDNIGHT SNACK · v2.0.0<br>一个关于下班、饥饿与自我原谅的小游戏</div>'+
      '<div style="margin:18px 0;font-size:13.5px;color:var(--dim);line-height:2">'+
      '你已经写完了今天最后一个 bug。<br>或者说 —— 你写不动了。</div>'+
      '<button class="primary" id="start">开始今晚 →</button>'+
      '<label class="loadbtn" for="menufile">📂 载入我的门店菜单（menu.json）</label>'+
      '<input type="file" id="menufile" accept=".json,.js,.txt" style="display:none">'+
      '<div id="menustat">'+srcTxt+(MENU_STORE?' · '+MENU_STORE:'')+'</div>'+
      '<div class="srcnote">'+(MENU_AT?'数据时间 '+MENU_AT:'数据源：麦当劳 MCP · query-meals / list-nutrition-foods / query-meal-detail')+
      '<br>配料带 <span style="color:var(--red)">*</span> 的为已知值，需人工核对（见 data/menu-verify.txt）</div>'+
      '<div class="warn">单轮约 3–5 分钟 · 没有失败结局 · 没有正确答案<br>'+
      '同一种可以多份 · 点哪一块就吃掉哪一块 · 加 ?debug=1 看状态机</div>'+
      '</div>';

    document.getElementById('menufile').onchange = e=>{
      const f = e.target.files && e.target.files[0];
      if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{
        /* 载入失败 → 状态与菜单都不变（回退），只提示 */
        const ok = loadMenuText(String(r.result||''));
        const st = document.getElementById('menustat');
        FSM.dispatch('LOAD_MENU', {ok});
        st.innerHTML = ok ? '✓ 已载入 '+MENU.length+' 项'+(MENU_STORE?' · '+MENU_STORE:'')+' —— 直接开始就能用'
                          : '✗ 这个文件读不出来，确认一下是不是 data/menu.json';
        st.style.color = ok ? 'var(--green)' : 'var(--red)';
        Audio.play(ok ? 'mood' : 'error');
      };
      r.readAsText(f);
    };
    document.getElementById('start').onclick=()=>{
      Audio.init(); Audio.resume(); Audio.play('order');
      res();
    };
  });
}

/* ---------- 音频 UI ---------- */
(function bindAudioUI(){
  Audio.restore();
  const mute=document.getElementById('mute'), vol=document.getElementById('vol'), lab=document.getElementById('vollabel');
  vol.value = Math.round(Audio.volume*100);
  lab.textContent = vol.value;
  const syncIcon = ()=>{ mute.textContent = Audio.muted ? '🔇' : '🔊'; };
  syncIcon();
  mute.onclick = ()=>{
    Audio.init(); Audio.setMuted(!Audio.muted); syncIcon();
    if(!Audio.muted) Audio.play('click');
  };
  vol.oninput = ()=>{
    Audio.init();
    const v = +vol.value; lab.textContent = v;
    Audio.setVolume(v/100);
    if(Audio.muted){ Audio.setMuted(false); syncIcon(); }
  };
  vol.onchange = ()=> Audio.play('click');
  document.addEventListener('pointerdown', ()=>{ Audio.init(); Audio.resume(); }, {once:true});
})();

(function(){ const el=document.getElementById('stname'); if(el && MENU_STORE) el.textContent='· '+MENU_STORE; })();

FSM.render();
run();
